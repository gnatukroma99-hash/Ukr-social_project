name: Rust migration
on:
  push:
    branches: [rust-migration]
  pull_request:
    paths:
      - 'Cargo.*'
      - 'package-lock.json'
      - 'crates/**'
      - 'app/**'
      - 'experiments/rust-ui/**'
      - 'tools/build-rust-preview.mjs'
      - 'tools/check-rust-core.mjs'
      - 'tools/check-rust-preview.mjs'
      - 'tools/check-rust-storage.mjs'
      - 'tools/export-rust-content.mjs'
      - 'tools/rust-arcade-parity.mjs'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: rustup override set 1.91.1
      - run: cargo fetch --locked
      - run: node tools/export-rust-content.mjs --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo check --workspace --locked --offline --target wasm32-unknown-unknown
      - run: node tools/check-rust-core.mjs
      - run: node tools/check-rust-storage.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Wasm bindings generator
        run: |
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive.tar.gz" -o "$RUNNER_TEMP/$archive.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - run: node tools/build-rust-preview.mjs
      - run: node tools/check-rust-preview.mjs
