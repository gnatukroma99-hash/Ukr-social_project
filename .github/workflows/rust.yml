name: Rust migration
on:
  push:
    branches: [rust-migration]
  pull_request:
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'app/**'
      - 'tools/check-rust-core.mjs'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: rustup override set 1.91.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo check --workspace --locked --offline --target wasm32-unknown-unknown
      - run: node tools/check-rust-core.mjs
